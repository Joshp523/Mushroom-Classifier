<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mushroom Classifier</title>
<meta name="theme-color" content="#0c0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Classifier">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f0a;--surface:#141810;--border:#2a3024;--text:#e8ead4;--muted:#8a917c;--safe:#7ec850;--danger:#e05a3a;--accent:#c9d46a}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:radial-gradient(ellipse at 50% -10%,#232b17,var(--bg) 60%) fixed;color:var(--text);font:300 17px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px 40px}
header{text-align:center;margin-bottom:18px}
header img{width:64px;height:64px;border-radius:16px}
h1{font:700 34px/1.1 'Playfair Display',Georgia,serif;margin-top:10px}
.tag{font:400 12px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.status{display:flex;align-items:center;gap:10px;justify-content:center;font:400 13px 'DM Mono',monospace;color:var(--muted);margin:0 0 16px;min-height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}.dot.loading{animation:p 1s infinite alternate}.dot.ready{background:var(--safe)}.dot.error{background:var(--danger)}
@keyframes p{to{opacity:.25}}
.prog{height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin:-8px 0 18px}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.btns{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:500 17px 'DM Sans',sans-serif;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#14180c}
.btn:disabled{opacity:.45}
.btn svg{width:22px;height:22px}
input[type=file]{display:none}
.photo{margin-top:18px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#000;position:relative}
.photo img{display:block;width:100%;max-height:62vh;object-fit:contain}
.photo .scan{position:absolute;inset:0;background:linear-gradient(transparent,#c9d46a33,transparent);background-size:100% 40%;background-repeat:no-repeat;animation:s 1.2s linear infinite}
@keyframes s{from{background-position:0 -40%}to{background-position:0 140%}}
.card{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.verdict{font:700 26px/1.2 'Playfair Display',serif;display:flex;gap:10px;align-items:center}
.verdict.safe{color:var(--safe)}.verdict.danger{color:var(--danger)}
.row{margin-top:14px}.row .l{display:flex;justify-content:space-between;font:400 12px 'DM Mono',monospace;letter-spacing:.08em;color:var(--muted)}
.track{height:8px;background:var(--border);border-radius:8px;overflow:hidden;margin-top:6px}.track i{display:block;height:100%;width:0;transition:width .6s}
.warn{margin-top:16px;padding:12px 14px;border-left:3px solid var(--danger);background:#e05a3a14;font-size:15px}
.warn b{font-weight:500}
.again{margin-top:14px;width:100%}
.hint{margin-top:16px;color:var(--muted);font-size:14px;text-align:center}
footer{text-align:center;color:var(--muted);font:400 11px 'DM Mono',monospace;letter-spacing:.06em;margin-top:26px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="icon-192.png" alt=""><h1>Mushroom Classifier</h1><p class="tag">Neural net mushroom classifier</p></header>

  <div class="status"><span class="dot loading" id="dot"></span><span id="st">Loading the model…</span></div>
  <div class="prog" id="prog" hidden><i id="bar"></i></div>

  <div class="btns" id="pick">
    <label class="btn main" id="b-cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>Take a photo<input type="file" accept="image/*" capture="environment" id="f-cam"></label>
    <label class="btn" id="b-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>Choose from photos<input type="file" accept="image/*" id="f-lib"></label>
    <p class="hint">Fill the frame with one mushroom, cap and stem in view, in good light.</p>
  </div>

  <div id="out" hidden>
    <div class="photo"><img id="img" alt="Your mushroom photo"><div class="scan" id="scan"></div></div>
    <div class="card" id="res" hidden>
      <div class="verdict" id="vd"></div>
      <div class="row"><div class="l"><span>RESEMBLES EDIBLE</span><span id="pe"></span></div><div class="track"><i id="be" style="background:var(--safe)"></i></div></div>
      <div class="row"><div class="l"><span>RESEMBLES POISONOUS</span><span id="pp"></span></div><div class="track"><i id="bp" style="background:var(--danger)"></i></div></div>
      <div class="warn"><b>Never eat a wild mushroom based solely on this app.</div>
    </div>
    <button class="btn again" id="again">Try another photo</button>
  </div>

  <footer>Runs entirely on your phone · photos never leave the device</footer>
</div>

<script src="ort.wasm.min.js"></script>
<script>
// Must match the notebook's validation transforms.
const MEAN=[0.485,0.456,0.406],STD=[0.229,0.224,0.225],SIZE=224;
let TH=null;                // chance-of-poison cut-off chosen in training (model.json); flags ~98% of poisonous test photos
const CENTER_CROP=false;    // set true if val_transforms used Resize(256)+CenterCrop(224); false = squash whole photo to 224x224
const $=id=>document.getElementById(id);
let session=null;

function status(state,msg){$('dot').className='dot '+state;$('st').textContent=msg}

// The model is split into parts (GitHub's upload page caps files at 25 MB). Fetch them, join, and start ONNX Runtime.
async function loadModel(){
  try{
    ort.env.wasm.wasmPaths='./';ort.env.wasm.numThreads=1;   // GitHub Pages can't enable threads
    const meta=await (await fetch('model.json')).json();TH=meta.threshold??null;
    const buf=new Uint8Array(meta.bytes);let got=0;$('prog').hidden=false;
    for(let i=0;i<meta.parts;i++){
      const r=await fetch('model.part'+i);if(!r.ok)throw new Error('model.part'+i+' is missing ('+r.status+')');
      const rd=r.body.getReader();
      for(;;){const {done,value}=await rd.read();if(done)break;buf.set(value,got);got+=value.length;
        $('bar').style.width=(got/meta.bytes*100)+'%';status('loading',`Loading the model… ${Math.round(got/1e6)} of ${Math.round(meta.bytes/1e6)} MB`)}
    }
    status('loading','Starting the model…');
    session=await ort.InferenceSession.create(buf,{executionProviders:['wasm']});
    $('prog').hidden=true;status('ready','Ready. Photograph a mushroom.');
  }catch(e){status('error','The model could not load: '+(e.message||e));console.error(e)}
}

function toTensor(img){
  const c=document.createElement('canvas');c.width=c.height=SIZE;const x=c.getContext('2d');
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(CENTER_CROP){const s=Math.min(sw,sh)*224/256;sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s}
  x.drawImage(img,sx,sy,sw,sh,0,0,SIZE,SIZE);
  const d=x.getImageData(0,0,SIZE,SIZE).data,N=SIZE*SIZE,f=new Float32Array(3*N);
  for(let i=0;i<N;i++)for(let k=0;k<3;k++)f[k*N+i]=(d[i*4+k]/255-MEAN[k])/STD[k];
  return new ort.Tensor('float32',f,[1,3,SIZE,SIZE]);
}
const softmax=l=>{const m=Math.max(...l),e=l.map(v=>Math.exp(v-m)),s=e.reduce((a,b)=>a+b);return e.map(v=>v/s)};

async function classify(file){
  if(!file)return;
  $('pick').hidden=true;$('out').hidden=false;$('res').hidden=true;$('scan').hidden=false;
  const img=$('img');img.src=URL.createObjectURL(file);await img.decode();
  if(!session){status('loading','Still loading the model. Your photo will be checked as soon as it is ready.');while(!session&&$('dot').className!=='dot error')await new Promise(r=>setTimeout(r,300))}
  if(!session){$('scan').hidden=true;return}
  await new Promise(r=>setTimeout(r,30));   // let the screen repaint before the heavy work
  try{
    const out=await session.run({image:toTensor(img)}),l=Array.from(out.logits.data),p=softmax(l),bad=TH!=null?p[1]>TH:l[1]>0.3;
    $('scan').hidden=true;$('res').hidden=false;
    $('vd').className='verdict '+(bad?'danger':'safe');$('vd').textContent=bad?'☠ Resembles a poisonous species':'Resembles an edible species';
    $('pe').textContent=(p[0]*100).toFixed(1)+'%';$('pp').textContent=(p[1]*100).toFixed(1)+'%';
    requestAnimationFrame(()=>{$('be').style.width=p[0]*100+'%';$('bp').style.width=p[1]*100+'%'});
    $('res').scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){$('scan').hidden=true;alert('Could not check this photo: '+(e.message||e))}
}
$('f-cam').onchange=e=>{classify(e.target.files[0]);e.target.value=''};
$('f-lib').onchange=e=>{classify(e.target.files[0]);e.target.value=''};
$('again').onclick=()=>{$('out').hidden=true;$('pick').hidden=false;$('be').style.width=$('bp').style.width='0';scrollTo(0,0)};
loadModel();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
